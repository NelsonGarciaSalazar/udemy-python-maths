[project]
name = "udemy-python-maths"
version = "0.1.0"
description = "Aprendizaje de matemáticas con Python — curso Udemy"
requires-python = ">=3.11"

dependencies = [
    "numpy>=2.2",
    "matplotlib>=3.10",
    "sympy>=1.13",
